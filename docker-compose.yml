services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dream-catcher
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash}
    volumes:
      - dream-data:/app
    env_file:
      - .env

volumes:
  dream-data:
