name: CI

on:
  push:
    branches: [main, stage]
  pull_request:
    branches: [main, stage]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build Docker image
        run: docker build -t dream-catcher:ci .
      - name: Container smoke test (/health)
        run: |
          docker run -d --name dc -p 3001:3001 -e DATABASE_URL=postgres://x:x@localhost:5432/x dream-catcher:ci
          sleep 5
          curl -fsS http://localhost:3001/health
