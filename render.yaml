# Render Blueprint (reference): production + staging Docker web services and Postgres.
services:
  - type: web
    name: dream-catcher-2          # production, tracks main
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: dream-catcher-db
          property: connectionString

  - type: web
    name: dream-catcher-stage      # staging, tracks the stage branch
    runtime: docker
    plan: free
    branch: stage
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL        # points at the separate dreams_stage database
        sync: false

databases:
  - name: dream-catcher-db
    plan: free
    databaseName: dreams
    user: dreams_user
