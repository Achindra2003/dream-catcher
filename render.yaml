services:
  - type: web
    name: dream-catcher
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev --build-from-source
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_API_KEY
        sync: false
