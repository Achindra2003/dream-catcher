# Render Blueprint: production + staging web services and Postgres, as code.
services:
  - type: web
    name: dream-catcher
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: dream-catcher-db
          property: connectionString

  - type: web
    name: dream-catcher-stage
    runtime: node
    plan: free
    branch: stage
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: staging
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false

databases:
  - name: dream-catcher-db
    plan: free
    databaseName: dreams
    user: dreams_user
